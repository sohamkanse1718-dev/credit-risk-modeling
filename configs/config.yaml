# MLflow and Experiment Configuration for Lending Club Default Risk

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "Lending-Club-Default-Risk-Experiments"
  artifact_location: "mlruns"
  registered_model_name: "LendingClubDefaultRiskModel"

business:
  cost_ratio: 4
  min_recall: 0.50
  threshold_start: 0.01
  threshold_end: 1.00
  threshold_step: 0.01
  recall_levels: [0.30, 0.40, 0.50, 0.60]
  sensitivity_ratios: [1, 2, 3, 4, 5, 8]

data:
  data_dir: "data/processed"
  interim_dir: "data/interim"
  models_dir: "models"
  random_state: 42

api:
  model_source: "local"  # "local" or "mlflow"
  mlflow_model_alias: "champion"  # "champion", "challenger1", "challenger2"
